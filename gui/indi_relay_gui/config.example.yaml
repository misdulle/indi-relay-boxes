# indi-relay-boxes GUI configuration.
# Copy to ~/.config/indi-relay-boxes/config.yaml or pass --config <file>.

indiserver:
  host: 192.168.1.29
  port: 7624

# INDI device names as reported by the drivers (INDI driver "name").
# The GUI switches every driver on (CONNECTION/CONNECT) as soon as the
# indiserver announces it.
devices:
  relay16: Relay16
  kmtronic8: KMTronic8
  roof: eulRoof
  focuser: EulFocuser   # publishes SCOPE_SAFETY; OPEN/CLOSE are gated on it
  mount: EQMod Mount    # pointing (RA/DEC, pier side, park) for the scope view

# Scope-visualization calibration:
# imu_park_quaternion - the IMU reading with the mount parked (scope level,
#   pointing south, west of the pier); all drawn angles are relative to it.
# imu_optical_axis - which IMU body axis looks along the telescope tube.
imu_park_quaternion: [0.108337, -0.022705, -0.081787, 0.990479]
imu_optical_axis: +x
scope_view_rotation: 200   # top view: az rotated by this many degrees clockwise
                           # (200 = south up + 20 deg clockwise shed orientation)

# Viewpoint (azimuth/altitude in degrees) of the 3D mount stick figure:
# the camera looks at the mount from this direction. az 180 = see it from the
# south, add 20 for the shed orientation like scope_view_rotation.
mount3d_view:
  az: 200
  alt: 25

# RTSP cameras inside the shed, chosen in the middle column dropdown
# (OFF / cam1 / cam2 - names are free, they become the dropdown entries).
# The selected camera's reader continuously grabs the stream but only decodes
# a frame at the configured rate, so use each camera's SUBSTREAM (second
# channel) for a low CPU load. Needs opencv-python (pip install
# opencv-python-headless); passwords are stored in plaintext in this file
# and never written to the log. "enabled" selects the camera shown at start.
shed_cameras:
  fps: 8                 # default frame rate (1-30) used by every camera
                         # that does not set its own fps
  cameras:
    cam1:
      enabled: true
      url: rtsp://user:pass@192.168.1.20:554/Streaming/Channels/2
    cam2:
      enabled: false
      url: ""

# pi5 wake-up: entering "static" from "inactive" with the pi5 unreachable.
# The indiserver runs on the pi5, so the pi5 power relay of KMTronic8 is
# switched directly over HTTP (same protocol as the KMTronic8 driver:
# GET /FF0N01, /status.xml, /relays.cgi). After the pi5 answers the ping
# again the GUI reconnects to the indiserver automatically.
# ping_host defaults to indiserver.host.
pi5_wake:
  enabled: true
  host: 192.168.1.23    # KMTronic8 box
  port: 80
  user: admin
  password: ""          # set the box password here (stored in plaintext!)
  relay: 1              # 1..8: the relay powering the pi5
  ping_host: 192.168.1.29
  timeout_s: 3
  wait_s: 90            # how long to watch for the pi5 coming back

# Relays whose displayed name (PORT_NAMES entry) matches one of these are hidden.
relay_exclude_names: [none]

sequences:
  # Executed when switching the operating mode to "starting".
  # Goes to "running" automatically when every step succeeds.
  starting:
    - step: relay_on
      device: kmtronic8
      port: pi5
    - step: wait
      seconds: 30
    - step: roof_open
      timeout: 180
    - step: relay_on
      device: kmtronic8
      port: mount
    - step: relay_on
      device: kmtronic8
      port: camera

  # Executed when switching to "stopping". Ends in "inactive" when done.
  stopping:
    - step: roof_close
      timeout: 180
    - step: relay_off
      device: kmtronic8
      port: camera
    - step: relay_off
      device: kmtronic8
      port: mount
    - step: wait
      seconds: 5
    - step: relay_off
      device: kmtronic8
      port: pi5

# Extra health checks that run while the operating mode is "running".
# The same monitors feed the Heartbeats panel at all times (pi5 ping,
# IMU quaternion liveness on UDP 2346). The SCOPE_SAFETY light of
# EulFocuser appears as a heartbeat row as well and gates roof OPEN/CLOSE.
# type: quaternion also decodes each datagram for the scope position view.
# interval_s: how often all enabled checks are evaluated.
# grace_s:    cool-down after a recovery action before counting new failures.
# failures:   consecutive failed evaluations before the recovery sequence runs.
# recovery:   a sequence (same step vocabulary) executed once per failure episode.
checks:
  interval_s: 15
  grace_s: 120
  pi5_ping:
    type: ping
    enabled: true
    host: 192.168.1.29
    timeout_s: 5
    failures: 3
    recovery:
      - step: relay_cycle
        device: kmtronic8
        port: pi5
        seconds: 10
  imu_udp:
    type: quaternion
    enabled: true
    bind: 0.0.0.0
    port: 2346          # the IMU broadcasts quaternions here
    timeout_s: 60
    failures: 3
    recovery:
      - step: relay_cycle
        device: kmtronic8
        port: imu
        seconds: 10

roof_timeout_s: 180
